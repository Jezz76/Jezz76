<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">JEZZ76 / Night Shift</title><desc id="desc">A custom pixel-game scene: a quiet coding room above the city, a programmer at a desk, a sleeping cat, and a minimal game HUD. Informatics student, semester 7, Unsoed. Decorative game scene, not a live game or activity tracker.</desc>
